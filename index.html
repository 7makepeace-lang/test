<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달빛카페 메뉴판</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        header h1 {
            font-size: 36px;
            color: #2c3e50;
            margin: 20px 0;
            font-weight: bold;
        }
        .menu-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: auto 0;
        }
        .menu-item {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
        }
        .menu-name {
            font-weight: bold;
            color: #34495e;
        }
        .menu-price {
            color: #e67e22;
            font-weight: bold;
        }
        footer p {
            font-size: 16px;
            color: #7f8c8d;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>달빛카페</h1>
    </header>
    <main class="menu-container">
        <div class="menu-item">
            <span class="menu-name">아메리카노</span>
            <span class="menu-price">3,500원</span>
        </div>
        <div class="menu-item">
            <span class="menu-name">카페라떼</span>
            <span class="menu-price">4,000원</span>
        </div>
        <div class="menu-item">
            <span class="menu-name">딸기케이크</span>
            <span class="menu-price">5,500원</span>
        </div>
    </main>
    <footer>
        <p>가상의 가게입니다</p>
    </footer>
</body>
</html>
